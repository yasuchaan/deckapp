<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Deck お知らせ管理</title>
<style>body{font:17px system-ui;background:#141414;color:#eee;max-width:900px;margin:auto;padding:24px}input,textarea,select,button{font:inherit;padding:12px;border-radius:8px;box-sizing:border-box;max-width:100%}input,textarea{width:100%}textarea{min-height:130px}label{display:block;margin:18px 0}button{margin:6px;background:#f5cd48;color:#111;border:0;cursor:pointer}article{padding:16px;border-bottom:1px solid #555}small{color:#bbb}#preview{white-space:pre-wrap;border:1px solid #777;padding:20px}p{line-height:1.6}</style>
<h1>Deck お知らせ管理</h1><p>この画面では公開されません。編集データはこのタブ内だけで処理し、サーバーへ送信しません。管理データは自分専用のFiles/iCloud Driveに保存してください。公開JSONだけをGitHubへアップロードし、Actionsの手動公開で配信します。</p><p>保存は「管理データを保存」でファイルへ書き出します。ブラウザを閉じる前に保存してください。公開用ファイルには下書き・内部タグを含めません。</p>
<input type="file" id="importFile" accept="application/json,.json"><button id="backup">管理データを保存</button><button id="export">公開JSONを書き出す</button><button id="new">新規作成</button><p id="message" role="status"></p><section id="list"></section>
<form id="editor"><h2>編集</h2><p id="identity"></p><label>対象アプリ<select id="apps"><option value="both">両方</option><option value="scoredeck">Score Deck</option><option value="scheduledeck">Schedule Deck</option></select></label><label>公開状態<select id="status"><option value="draft">下書き</option><option value="published">公開対象</option></select></label><label>重要度<select id="importance"><option value="normal">通常</option><option value="important">重要（上部固定）</option></select></label><label>内部タグ（カンマ区切り）<input id="tags"></label><label>対象バージョン<input id="version"></label><label>公開日時<input type="datetime-local" id="date" required></label>
<div id="languages"></div><p>既存の関連リンク・回避策は読み込み時に保持します。</p><button type="submit">編集内容を反映</button><button type="button" id="showPreview">プレビュー</button><button type="button" id="delete">削除</button></form><section id="preview" hidden></section>
<script>
'use strict';
const $=id=>document.getElementById(id);let records=[],selected=null,dirty=false,needsSave=false;
for(const lang of ['ja','en']){const h=document.createElement('h3');h.textContent=lang==='ja'?'日本語':'English';$('languages').append(h);for(const [key,label] of [['title','タイトル'],['summary','概要（省略可）'],['body','本文']]){const l=document.createElement('label');l.textContent=label;const e=document.createElement(key==='title'?'input':'textarea');e.id=lang+'_'+key;l.append(e);$('languages').append(l)}}
function msg(t){$('message').textContent=t}function download(name,data){const u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),5000)}
function render(){const list=$('list');list.replaceChildren();for(const r of records){const a=document.createElement('article'),b=document.createElement('button');b.textContent=(r.translations.ja||r.translations.en).title||'無題';b.onclick=()=>{if(dirty&&!confirm('未反映の編集を破棄しますか？'))return;edit(r)};a.append(b,document.createTextNode(' '+r.status+' / '+r.apps.join(', ')));list.append(a)}}
function edit(r){selected=r.id;$('identity').textContent='ID: '+r.id;$('apps').value=r.apps.length===2?'both':r.apps[0];$('status').value=r.status;$('importance').value=r.category==='important'?'important':'normal';$('tags').value=(r.internalTags||[]).join(', ');$('version').value=r.targetVersion||'';const d=new Date(r.publishedAt);$('date').value=new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,16);for(const lang of ['ja','en'])for(const key of ['title','summary','body'])$(lang+'_'+key).value=r.translations[lang]?.[key]||'';dirty=false;$('preview').hidden=true}
function collect(){const old=records.find(r=>r.id===selected);if(!old)throw Error('新規作成してください');const r=structuredClone(old);r.apps=$('apps').value==='both'?['scoredeck','scheduledeck']:[$('apps').value];r.status=$('status').value;r.category=$('importance').value==='important'?'important':(old.category==='important'?'other':old.category);r.internalTags=$('tags').value.split(',').map(s=>s.trim()).filter(Boolean);r.targetVersion=$('version').value;r.publishedAt=new Date($('date').value).toISOString();for(const lang of ['ja','en']){r.translations[lang]={...r.translations[lang]};for(const key of ['title','summary','body'])r.translations[lang][key]=$(lang+'_'+key).value}return r}
function validate(r,publish=false){if(!r||typeof r.id!=='string'||!r.id||r.id.length>200||!Array.isArray(r.apps)||!r.apps.length||r.apps.some(a=>!['scoredeck','scheduledeck'].includes(a))||!['draft','published'].includes(r.status)||!['important','bug','improvement','feature','other'].includes(r.category)||!Number.isFinite(Date.parse(r.publishedAt)))throw Error('管理データの形式が不正です');if(!r.translations||Object.keys(r.translations).some(l=>!['ja','en'].includes(l))||!(r.translations.ja||r.translations.en))throw Error('翻訳が必要です');for(const t of Object.values(r.translations)){if(typeof t.title!=='string'||typeof t.summary!=='string'||typeof t.body!=='string'||[...t.title].length>300||[...t.summary].length>2000||[...t.body].length>50000)throw Error('本文または文字数が不正です');if(publish&&(!t.title.trim()||!t.body.trim()))throw Error('公開するには日英のタイトルと本文を入力してください')}for(const l of r.links||[]){const u=new URL(l.url);if(u.protocol!=='https:'||u.username||u.password||(u.port&&u.port!=='443'))throw Error('関連リンクは認証情報なしのHTTPSが必要です')}}
$('new').onclick=()=>{if(dirty&&!confirm('未反映の編集を破棄しますか？'))return;const r={id:crypto.randomUUID(),apps:['scoredeck','scheduledeck'],category:'other',status:'draft',internalTags:[],publishedAt:new Date().toISOString().replace(/\.\d{3}Z$/,'Z'),translations:{ja:{title:'',summary:'',body:''},en:{title:'',summary:'',body:''}}};records.push(r);needsSave=true;render();edit(r)};
$('editor').oninput=()=>dirty=true;$('editor').onsubmit=e=>{e.preventDefault();try{const r=collect();validate(r,r.status==='published');records=records.map(x=>x.id===r.id?r:x);dirty=false;needsSave=true;render();msg('反映しました。管理データを保存してください。')}catch(e){msg(e.message)}};
$('showPreview').onclick=()=>{try{const r=collect();$('preview').hidden=false;$('preview').textContent=[r.apps.join(' / '),r.publishedAt,r.category==='important'?'上部固定':'',r.targetVersion||'',...['ja','en'].map(l=>[l,r.translations[l].title,r.translations[l].summary,r.translations[l].body,r.translations[l].workaround||''].join('\n\n')),...(r.links||[]).map(l=>l.title+'\n'+l.url)].filter(Boolean).join('\n\n────────\n\n')}catch(e){msg(e.message)}};
$('delete').onclick=()=>{if(selected&&confirm('このお知らせを削除しますか？ 公開済みの場合は公開JSONの更新も必要です。')){records=records.filter(r=>r.id!==selected);selected=null;$('editor').reset();dirty=false;needsSave=true;render()}};
$('backup').onclick=()=>{if(dirty){msg('先に編集内容を反映してください');return}download('deck-announcements-admin.json',{adminVersion:1,records});needsSave=false;msg('ダウンロード先に保存されたファイルを確認してください')};
$('export').onclick=()=>{try{if(dirty)throw Error('先に編集内容を反映してください');const announcements=records.filter(r=>r.status==='published').map(r=>{validate(r,true);const publicItem={};for(const key of ['id','apps','category','publishedAt','targetVersion','translations','links'])if(r[key]!==undefined)publicItem[key]=structuredClone(r[key]);for(const lang of Object.keys(publicItem.translations)){const original=publicItem.translations[lang];publicItem.translations[lang]={};for(const key of ['title','summary','body','workaround'])if(original[key]!==undefined)publicItem.translations[lang][key]=original[key]}if(publicItem.links)publicItem.links=publicItem.links.map(l=>({title:l.title,url:l.url}));publicItem.publishedAt=new Date(r.publishedAt).toISOString().replace(/\.\d{3}Z$/,'Z');return publicItem});const feed={schemaVersion:1,announcements};if(announcements.length>500||new Blob([JSON.stringify(feed,null,2)]).size>1048576)throw Error('公開上限を超えています');download('announcements.json',feed);msg('書き出しました。GitHubの認証済み画面でdocs/announcements.jsonを更新し、検証成功後にActionsでpublishを選んで手動公開してください。')}catch(e){msg(e.message)}};
$('importFile').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;if(file.size>10485760)throw Error('ファイルが大きすぎます');if(!confirm('現在の管理データを読み込んだ内容で置き換えます。保存は済んでいますか？'))return;const data=JSON.parse(await file.text());const next=data.adminVersion===1?data.records:data.schemaVersion===1?data.announcements.map(r=>({...r,status:'published',internalTags:[]})):null;if(!Array.isArray(next)||next.length>500)throw Error('対応していない形式です');next.forEach(r=>validate(r));if(new Set(next.map(r=>r.id)).size!==next.length)throw Error('IDが重複しています');records=next;selected=null;dirty=false;needsSave=false;render();if(records.length)edit(records[0]);msg('読み込みました')}catch(e){msg(e.message)}};
window.onbeforeunload=e=>{if(dirty||needsSave){e.preventDefault();e.returnValue=''}};
</script></html>
